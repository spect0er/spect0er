<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" width="490" height="360">
  <style>
    .bg         { fill: #0d1117; }
    .dot-red    { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green  { fill: #27c93f; }
    .title-text { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 13px; fill: #8b949e; font-weight: 600; }
    .label      { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 11.5px; fill: #8b949e; font-weight: bold; }
    .val        { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 11.5px; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect class="bg" width="490" height="360" rx="12" stroke="#30363d" stroke-width="1" />

  <!-- Terminal title bar -->
  <path d="M0 12 C0 5.37 5.37 0 12 0 L478 0 C484.63 0 490 5.37 490 12 L490 38 L0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="490" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Traffic light dots -->
  <circle cx="20" cy="19" r="6" class="dot-red"    />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green"  />

  <!-- Title -->
  <text x="245.0" y="23" text-anchor="middle" class="title-text">spect0er@github:~ (neofetch)</text>

  <!-- Info rows -->
  
    <g id="card-line-0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.05s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.05s" fill="freeze" />
      <text x="25"  y="62" class="label">User:</text>
      <text x="105" y="62" class="val" fill="#bc8cff">Kartikey Mishra  |  spect0er</text>
    </g>
    <g id="card-line-1">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.17s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.17s" fill="freeze" />
      <text x="25"  y="87" class="label">Role:</text>
      <text x="105" y="87" class="val" fill="#58a6ff">Full-Stack Dev  |  ML &amp; GenAI Engineer</text>
    </g>
    <g id="card-line-2">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.29s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.29s" fill="freeze" />
      <text x="25"  y="112" class="label">Lang:</text>
      <text x="105" y="112" class="val" fill="#d2a8ff">C++, JavaScript, Python, Java, C, HTML, CSS</text>
    </g>
    <g id="card-line-3">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.41s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.41s" fill="freeze" />
      <text x="25"  y="137" class="label">Stack:</text>
      <text x="105" y="137" class="val" fill="#e3b341">React, Node.js, Express, TensorFlow, Scikit-learn</text>
    </g>
    <g id="card-line-4">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.53s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.53s" fill="freeze" />
      <text x="25"  y="162" class="label">Tools:</text>
      <text x="105" y="162" class="val" fill="#56d364">MySQL, MongoDB, Git, Postman, Anaconda</text>
    </g>
    <g id="card-line-5">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.65s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.65s" fill="freeze" />
      <text x="25"  y="187" class="label">Commits:</text>
      <text x="105" y="187" class="val" fill="#ffa116">327 contributions  |  🔥 23d streak</text>
    </g>
    <g id="card-line-6">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.77s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.77s" fill="freeze" />
      <text x="25"  y="212" class="label">Best Day:</text>
      <text x="105" y="212" class="val" fill="#79c0ff">35 commits on Jul 26</text>
    </g>
    <g id="card-line-7">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.89s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="0.89s" fill="freeze" />
      <text x="25"  y="237" class="label">Achieve:</text>
      <text x="105" y="237" class="val" fill="#ff7b72">150+ LeetCode  |  ML Anomaly Detection Patent</text>
    </g>
    <g id="card-line-status">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="1.01s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 7;0 0" dur="0.55s" begin="1.01s" fill="freeze" />
      <text x="25" y="262" class="label">Status:</text>
      <circle cx="109" cy="258" r="4" fill="#39d353" />
      <text x="120" y="262" class="val" fill="#39d353">Open for collabs &amp; building in public</text>
    </g>

  <!-- Colour palette -->
  <g>
    <text x="25" y="290" class="label">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.11s" fill="freeze" />Colors:
    </text>
    <rect x="105" y="280" width="18" height="12" rx="3" fill="#ff7b72"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.11s" fill="freeze" /></rect><rect x="127" y="280" width="18" height="12" rx="3" fill="#ffa657"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.16s" fill="freeze" /></rect><rect x="149" y="280" width="18" height="12" rx="3" fill="#d2a8ff"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.21s" fill="freeze" /></rect><rect x="171" y="280" width="18" height="12" rx="3" fill="#58a6ff"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.26s" fill="freeze" /></rect><rect x="193" y="280" width="18" height="12" rx="3" fill="#79c0ff"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.31s" fill="freeze" /></rect><rect x="215" y="280" width="18" height="12" rx="3" fill="#56d364"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.36s" fill="freeze" /></rect><rect x="237" y="280" width="18" height="12" rx="3" fill="#e3b341"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.41s" fill="freeze" /></rect><rect x="259" y="280" width="18" height="12" rx="3" fill="#8b949e"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.46s" fill="freeze" /></rect>
  </g>
</svg>