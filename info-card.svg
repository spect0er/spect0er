<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" width="490" height="360">
  <style>
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1px; }
    .title-bar { fill: #161b22; rx: 12px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 13px; fill: #8b949e; font-weight: 600; }
    .label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11.5px; fill: #8b949e; font-weight: bold; }
    .val { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11.5px; font-weight: 500; }
  </style>

  <!-- Container Box -->
  <rect class="bg" width="490" height="360" />

  <!-- Terminal Window Header -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 478 0 C 484.63 0 490 5.37 490 12 L 490 38 L 0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="490" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />

  <!-- Window Title -->
  <text x="245.0" y="23" text-anchor="middle" class="title-text">spect0er@github:~ (neofetch)</text>

  <!-- Content Lines -->
  
    <g id="card-line-0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.05s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.05s" fill="freeze" />
      <text x="25" y="62" class="label">OS:</text>
      <text x="105" y="62" class="val" fill="#58a6ff">Linux / Web Ecosystem</text>
    </g>
    <g id="card-line-1">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.17s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.17s" fill="freeze" />
      <text x="25" y="87" class="label">Host:</text>
      <text x="105" y="87" class="val" fill="#bc8cff">spect0er (Kartikey Mishra)</text>
    </g>
    <g id="card-line-2">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.29s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.29s" fill="freeze" />
      <text x="25" y="112" class="label">Role:</text>
      <text x="105" y="112" class="val" fill="#79c0ff">Full-Stack Engineer &amp; Systems Builder</text>
    </g>
    <g id="card-line-3">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.41s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.41s" fill="freeze" />
      <text x="25" y="137" class="label">LeetCode:</text>
      <text x="105" y="137" class="val" fill="#ffa116">leetcode.com/u/spect0er</text>
    </g>
    <g id="card-line-4">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.53s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.53s" fill="freeze" />
      <text x="25" y="162" class="label">LinkedIn:</text>
      <text x="105" y="162" class="val" fill="#0a66c2">linkedin.com/in/mishra-kartikey</text>
    </g>
    <g id="card-line-5">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.65s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.65s" fill="freeze" />
      <text x="25" y="187" class="label">Languages:</text>
      <text x="105" y="187" class="val" fill="#d2a8ff">TypeScript, Python, JavaScript, SQL, C++</text>
    </g>
    <g id="card-line-6">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.77s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.77s" fill="freeze" />
      <text x="25" y="212" class="label">Stack:</text>
      <text x="105" y="212" class="val" fill="#56d364">React, Next.js, Node.js, FastAPI, PostgreSQL</text>
    </g>
    <g id="card-line-7">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.89s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="0.89s" fill="freeze" />
      <text x="25" y="237" class="label">Uptime:</text>
      <text x="105" y="237" class="val" fill="#79c0ff">247 Contributions this year</text>
    </g>
    <g id="card-line-status">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.01s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.5s" begin="1.01s" fill="freeze" />
      <text x="25" y="262" class="label">Status:</text>
      <circle cx="109" cy="258" r="4" fill="#39d353" />
      <text x="120" y="262" class="val" fill="#39d353">Open for collaborations &amp; building software</text>
    </g>

  <!-- ANSI Color Blocks -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.11s" fill="freeze" />
    <text x="25" y="290" class="label">Colors:</text>
  </g>
  <rect x="105" y="280" width="18" height="12" rx="3" fill="#ff7b72"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.11s" fill="freeze" /></rect><rect x="127" y="280" width="18" height="12" rx="3" fill="#ffa657"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.16s" fill="freeze" /></rect><rect x="149" y="280" width="18" height="12" rx="3" fill="#d2a8ff"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.21s" fill="freeze" /></rect><rect x="171" y="280" width="18" height="12" rx="3" fill="#58a6ff"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.26s" fill="freeze" /></rect><rect x="193" y="280" width="18" height="12" rx="3" fill="#79c0ff"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.31s" fill="freeze" /></rect><rect x="215" y="280" width="18" height="12" rx="3" fill="#56d364"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.36s" fill="freeze" /></rect><rect x="237" y="280" width="18" height="12" rx="3" fill="#e3b341"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.41s" fill="freeze" /></rect><rect x="259" y="280" width="18" height="12" rx="3" fill="#8b949e"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.46s" fill="freeze" /></rect>
</svg>