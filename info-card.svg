<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" width="490" height="360">
  <style>
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1px; }
    .title-bar { fill: #161b22; rx: 12px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 13px; fill: #8b949e; font-weight: 600; }
    .label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
    .val { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 12.5px; font-weight: 500; }
    
    .line {
      opacity: 0;
      animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <!-- Container Box -->
  <rect class="bg" width="490" height="360" />

  <!-- Terminal Window Header -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 478 0 C 484.63 0 490 5.37 490 12 L 490 38 L 0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="490" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />

  <!-- Window Title -->
  <text x="245.0" y="23" text-anchor="middle" class="title-text">spect0er@github:~ (neofetch)</text>

  <!-- Content Lines -->
  
    <g class="line" style="animation-delay: 0.20s;">
      <text x="25" y="65" class="label">OS:</text>
      <text x="100" y="65" class="val" fill="#58a6ff">Linux / Web Ecosystem</text>
    </g>
    <g class="line" style="animation-delay: 0.32s;">
      <text x="25" y="93" class="label">Host:</text>
      <text x="100" y="93" class="val" fill="#bc8cff">spect0er @ FullStack</text>
    </g>
    <g class="line" style="animation-delay: 0.44s;">
      <text x="25" y="121" class="label">Role:</text>
      <text x="100" y="121" class="val" fill="#79c0ff">Full-Stack Developer & Software Engineer</text>
    </g>
    <g class="line" style="animation-delay: 0.56s;">
      <text x="25" y="149" class="label">Kernel:</text>
      <text x="100" y="149" class="val" fill="#d2a8ff">Python • TypeScript • React • Node</text>
    </g>
    <g class="line" style="animation-delay: 0.68s;">
      <text x="25" y="177" class="label">Uptime:</text>
      <text x="100" y="177" class="val" fill="#56d364">244 Contributions this year</text>
    </g>
    <g class="line" style="animation-delay: 0.80s;">
      <text x="25" y="205" class="label">Stack:</text>
      <text x="100" y="205" class="val" fill="#e3b341">Next.js • React • Node • Tailwind • PostgreSQL</text>
    </g>
    <g class="line" style="animation-delay: 0.92s;">
      <text x="25" y="233" class="label">Focus:</text>
      <text x="100" y="233" class="val" fill="#ff7b72">High Performance Web Apps & AI Tools</text>
    </g>
    <g class="line" style="animation-delay: 1.04s;">
      <text x="25" y="261" class="label">Status:</text>
      <text x="100" y="261" class="val" fill="#39d353">🟢 Open for collaborations & building software</text>
    </g>

  <!-- ANSI Color Blocks -->
  <g class="line" style="animation-delay: 1.1s;">
    <text x="25" y="312" class="label">Colors:</text>
  </g>
  <rect class="line" x="100" y="301" width="18" height="14" rx="3" fill="#ff7b72" style="animation-delay: 0.84s;" /><rect class="line" x="122" y="301" width="18" height="14" rx="3" fill="#ffa657" style="animation-delay: 0.92s;" /><rect class="line" x="144" y="301" width="18" height="14" rx="3" fill="#d2a8ff" style="animation-delay: 1.00s;" /><rect class="line" x="166" y="301" width="18" height="14" rx="3" fill="#58a6ff" style="animation-delay: 1.08s;" /><rect class="line" x="188" y="301" width="18" height="14" rx="3" fill="#79c0ff" style="animation-delay: 1.16s;" /><rect class="line" x="210" y="301" width="18" height="14" rx="3" fill="#56d364" style="animation-delay: 1.24s;" /><rect class="line" x="232" y="301" width="18" height="14" rx="3" fill="#e3b341" style="animation-delay: 1.32s;" /><rect class="line" x="254" y="301" width="18" height="14" rx="3" fill="#8b949e" style="animation-delay: 1.40s;" />
</svg>